# Without one, use: kubectl port-forward svc/devops-task 8081:80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
spec:
  ingressClassName: nginx
  rules:
    - host: devops.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  number: 80
