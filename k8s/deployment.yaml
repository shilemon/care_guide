apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
  labels:
    app: devops-task
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never remove a pod before a new one is ready
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-task
  template:
    metadata:
      labels:
        app: devops-task
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # "node" user in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-task:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-task-config
            - secretRef:
                name: devops-task-secret
                optional: true   # created with kubectl, never committed
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
